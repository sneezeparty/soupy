# Pre-commit hooks for Soupy.
# Activate locally with `pre-commit install` after cloning.
# Runs automatically on `git commit`; bypass only if you understand why with `git commit --no-verify`.
#
# Locally we keep this small — gitleaks (so secrets never escape) plus
# basic safety hooks. The strict lint/format gate runs in CI
# (.github/workflows/ci.yml) where it can see the full repo at once and
# isn't fighting with the developer's in-flight hunks.
#
# The "private data" hooks at the bottom compare what is being committed and
# pushed with the Discord archive on this machine (tools/privacy_check.py).
# They also run on the commit message and at push, so `pre-commit install`
# sets up all three git hooks.

default_install_hook_types: [pre-commit, pre-push, commit-msg]
# The hooks below run at commit unless they name another stage.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (block commits containing secrets)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml

  # This machine's archive holds real members' IDs, names and messages; the
  # repository is public. On a machine without the archive these pass at once.
  - repo: local
    hooks:
      - id: private-data
        name: private data (no real member IDs, names, places or archive text)
        entry: python3 tools/privacy_check.py --staged -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: private-data-push
        name: private data in the commits being pushed
        entry: python3 tools/privacy_check.py --push -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: private-data-message
        name: private data in the commit message
        entry: python3 tools/privacy_check.py -q --message
        language: system
        stages: [commit-msg]
