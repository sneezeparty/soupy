name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Installer smoke test
        run: |
          python install.py --help >/dev/null
          # Walk the wizard in dry-run with no input — should bail cleanly,
          # not hang or stack-trace at the existing-install prompt.
          test ! -f .env-stable || echo "(.env-stable not present in CI as expected)"
